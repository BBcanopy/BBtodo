name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # The default-branch revision supplies the merge script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Merge eligible Dependabot PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependabot_automerge.py

  main-ci:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # GITHUB_TOKEN merges do not trigger push workflows.
      - name: Start publishing pipeline on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
